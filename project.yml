name: MinisDiffusion

options:
  bundleIdPrefix: dev.minis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Keep the binary small; the 26 MB xcframework is already stripped.
    STRIP_INSTALLED_PRODUCT: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  Mirage:
    path: .

targets:
  MinisDiffusion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Mirage
        product: Mirage
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.minis.diffusion
        PRODUCT_NAME: MinisDiffusion
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # Linker flags required by the sd.cpp/ggml static library.
        OTHER_LDFLAGS:
          - "-lc++"
          - "-ObjC"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
